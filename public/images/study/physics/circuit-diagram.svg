<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" rx="16" fill="#0F172A"/>
  <text x="300" y="36" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="14" font-weight="600">SERIES &amp; PARALLEL CIRCUITS</text>
  <!-- SERIES label -->
  <text x="150" y="75" text-anchor="middle" fill="#22D3EE" font-family="system-ui" font-size="13" font-weight="700">Series Circuit</text>
  <!-- Series circuit -->
  <rect x="50" y="90" rx="4" width="200" height="120" stroke="#334155" stroke-width="1" fill="none"/>
  <!-- Battery -->
  <line x1="70" y1="150" x2="90" y2="150" stroke="#FBBF24" stroke-width="3"/>
  <line x1="95" y1="140" x2="95" y2="160" stroke="#FBBF24" stroke-width="3"/>
  <line x1="100" y1="150" x2="120" y2="150" stroke="#FBBF24" stroke-width="3"/>
  <text x="85" y="175" text-anchor="middle" fill="#FCD34D" font-family="system-ui" font-size="9">Battery</text>
  <!-- R1 -->
  <rect x="140" y="142" width="30" height="16" rx="3" stroke="#A78BFA" stroke-width="1.5" fill="#A78BFA" fill-opacity="0.15"/>
  <text x="155" y="154" text-anchor="middle" fill="#C4B5FD" font-family="system-ui" font-size="9">R₁</text>
  <!-- R2 -->
  <rect x="190" y="142" width="30" height="16" rx="3" stroke="#A78BFA" stroke-width="1.5" fill="#A78BFA" fill-opacity="0.15"/>
  <text x="205" y="154" text-anchor="middle" fill="#C4B5FD" font-family="system-ui" font-size="9">R₂</text>
  <!-- Wires -->
  <path d="M70 130 L70 110 L230 110 L230 130" stroke="#475569" stroke-width="1.5"/>
  <path d="M120 150 L140 150" stroke="#475569" stroke-width="1.5"/>
  <path d="M170 150 L190 150" stroke="#475569" stroke-width="1.5"/>
  <path d="M220 150 L240 150 L240 170 L60 170 L60 150 L70 150" stroke="#475569" stroke-width="1.5"/>
  <!-- Series formula -->
  <text x="150" y="230" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="11">R_total = R₁ + R₂ + ...</text>
  <text x="150" y="250" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="11">I = V / R_total</text>
  <!-- PARALLEL label -->
  <text x="450" y="75" text-anchor="middle" fill="#34D399" font-family="system-ui" font-size="13" font-weight="700">Parallel Circuit</text>
  <!-- Parallel circuit -->
  <rect x="340" y="90" rx="4" width="220" height="140" stroke="#334155" stroke-width="1" fill="none"/>
  <!-- Battery -->
  <line x1="360" y1="160" x2="380" y2="160" stroke="#FBBF24" stroke-width="3"/>
  <line x1="385" y1="150" x2="385" y2="170" stroke="#FBBF24" stroke-width="3"/>
  <line x1="390" y1="160" x2="410" y2="160" stroke="#FBBF24" stroke-width="3"/>
  <text x="375" y="185" text-anchor="middle" fill="#FCD34D" font-family="system-ui" font-size="9">Battery</text>
  <!-- Main wire top -->
  <path d="M410 160 L430 160 L430 120 L530 120 L530 160 L550 160" stroke="#475569" stroke-width="1.5"/>
  <!-- Main wire bottom -->
  <path d="M550 160 L550 200 L360 200 L360 160" stroke="#475569" stroke-width="1.5"/>
  <!-- R1 branch -->
  <path d="M430 120 L430 140" stroke="#475569" stroke-width="1.5"/>
  <rect x="415" y="140" width="30" height="16" rx="3" stroke="#FB7185" stroke-width="1.5" fill="#FB7185" fill-opacity="0.15"/>
  <text x="430" y="152" text-anchor="middle" fill="#FDA4AF" font-family="system-ui" font-size="9">R₁</text>
  <path d="M430 156 L430 200" stroke="#475569" stroke-width="1.5"/>
  <!-- R2 branch -->
  <path d="M480 120 L480 140" stroke="#475569" stroke-width="1.5"/>
  <rect x="465" y="140" width="30" height="16" rx="3" stroke="#FB7185" stroke-width="1.5" fill="#FB7185" fill-opacity="0.15"/>
  <text x="480" y="152" text-anchor="middle" fill="#FDA4AF" font-family="system-ui" font-size="9">R₂</text>
  <path d="M480 156 L480 200" stroke="#475569" stroke-width="1.5"/>
  <!-- Parallel formula -->
  <text x="450" y="260" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="11">1/R_total = 1/R₁ + 1/R₂</text>
  <text x="450" y="280" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="11">V same across all branches</text>
  <!-- Key difference box -->
  <rect x="120" y="310" rx="8" fill="#1E293B" width="360" height="60"/>
  <text x="300" y="332" text-anchor="middle" fill="#FBBF24" font-family="system-ui" font-size="11" font-weight="600">Key Difference</text>
  <text x="300" y="352" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="10">Series: same current, voltages add | Parallel: same voltage, currents add</text>
</svg>
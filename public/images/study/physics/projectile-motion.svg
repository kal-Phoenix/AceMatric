<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" rx="16" fill="#0F172A"/>
  <text x="300" y="36" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="14" font-weight="600">PROJECTILE MOTION</text>
  <!-- Axes -->
  <line x1="80" y1="340" x2="560" y2="340" stroke="#475569" stroke-width="1.5"/>
  <line x1="80" y1="340" x2="80" y2="60" stroke="#475569" stroke-width="1.5"/>
  <text x="320" y="375" text-anchor="middle" fill="#64748B" font-family="system-ui" font-size="12">Distance (x)</text>
  <text x="40" y="200" fill="#64748B" font-family="system-ui" font-size="12" transform="rotate(-90 40 200)">Height (y)</text>
  <!-- Grid lines -->
  <line x1="80" y1="260" x2="560" y2="260" stroke="#1E293B" stroke-width="1"/>
  <line x1="80" y1="180" x2="560" y2="180" stroke="#1E293B" stroke-width="1"/>
  <line x1="80" y1="100" x2="560" y2="100" stroke="#1E293B" stroke-width="1"/>
  <!-- Trajectory -->
  <path d="M100 340 Q200 100 320 220 Q440 340 540 340" stroke="#22D3EE" stroke-width="2.5" fill="none"/>
  <!-- Velocity vectors -->
  <line x1="100" y1="340" x2="160" y2="240" stroke="#F97316" stroke-width="2" marker-end="url(#vorange)"/>
  <text x="135" y="270" fill="#FDBA74" font-family="system-ui" font-size="11" font-weight="600">v₀</text>
  <!-- Components at launch -->
  <line x1="100" y1="340" x2="160" y2="340" stroke="#34D399" stroke-width="1.5" stroke-dasharray="5" marker-end="url(#vgreen)"/>
  <text x="130" y="358" fill="#6EE7B7" font-family="system-ui" font-size="10">v₀ₓ = v₀ cos θ</text>
  <line x1="100" y1="340" x2="100" y2="270" stroke="#A78BFA" stroke-width="1.5" stroke-dasharray="5" marker-end="url(#vpurple)"/>
  <text x="60" y="310" fill="#C4B5FD" font-family="system-ui" font-size="10">v₀ᵧ</text>
  <!-- Peak -->
  <circle cx="320" cy="220" r="5" fill="#FBBF24"/>
  <text x="320" y="210" text-anchor="middle" fill="#FCD34D" font-family="system-ui" font-size="10" font-weight="600">Peak (vᵧ = 0)</text>
  <!-- Gravity arrow -->
  <line x1="400" y1="150" x2="400" y2="220" stroke="#FB7185" stroke-width="2" marker-end="url(#vred)"/>
  <text x="415" y="190" fill="#FDA4AF" font-family="system-ui" font-size="11">g</text>
  <!-- Formulas box -->
  <rect x="380" y="65" rx="8" fill="#1E293B" width="190" height="75"/>
  <text x="395" y="85" fill="#22D3EE" font-family="monospace" font-size="11">x = v₀ₓ · t</text>
  <text x="395" y="105" fill="#22D3EE" font-family="monospace" font-size="11">y = v₀ᵧt − ½gt²</text>
  <text x="395" y="125" fill="#22D3EE" font-family="monospace" font-size="11">R = v₀² sin2θ / g</text>
  <defs>
    <marker id="vorange" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#F97316"/></marker>
    <marker id="vgreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#34D399"/></marker>
    <marker id="vpurple" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#A78BFA"/></marker>
    <marker id="vred" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#FB7185"/></marker>
  </defs>
</svg>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" fill="none">
  <rect width="600" height="400" rx="16" fill="#0F172A"/>
  <text x="300" y="36" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="14" font-weight="600">MITOSIS STAGES</text>
  <!-- Prophase -->
  <circle cx="90" cy="200" r="55" stroke="#22D3EE" stroke-width="2" fill="#22D3EE" fill-opacity="0.06"/>
  <path d="M75 180 Q90 170 105 180 M75 200 Q90 190 105 200 M75 220 Q90 210 105 220" stroke="#A78BFA" stroke-width="2"/>
  <text x="90" y="270" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="11" font-weight="600">Prophase</text>
  <!-- Metaphase -->
  <circle cx="230" cy="200" r="55" stroke="#22D3EE" stroke-width="2" fill="#22D3EE" fill-opacity="0.06"/>
  <line x1="230" y1="155" x2="230" y2="245" stroke="#475569" stroke-width="1" stroke-dasharray="4"/>
  <circle cx="230" cy="175" r="5" fill="#A78BFA"/>
  <circle cx="230" cy="190" r="5" fill="#A78BFA"/>
  <circle cx="230" cy="210" r="5" fill="#A78BFA"/>
  <circle cx="230" cy="225" r="5" fill="#A78BFA"/>
  <text x="230" y="270" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="11" font-weight="600">Metaphase</text>
  <!-- Anaphase -->
  <circle cx="370" cy="200" r="55" stroke="#22D3EE" stroke-width="2" fill="#22D3EE" fill-opacity="0.06"/>
  <circle cx="350" cy="175" r="4" fill="#F97316"/>
  <circle cx="350" cy="190" r="4" fill="#F97316"/>
  <circle cx="350" cy="205" r="4" fill="#F97316"/>
  <circle cx="390" cy="175" r="4" fill="#34D399"/>
  <circle cx="390" cy="190" r="4" fill="#34D399"/>
  <circle cx="390" cy="205" r="4" fill="#34D399"/>
  <text x="370" y="270" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="11" font-weight="600">Anaphase</text>
  <!-- Telophase -->
  <ellipse cx="510" cy="200" rx="65" ry="55" stroke="#22D3EE" stroke-width="2" fill="#22D3EE" fill-opacity="0.06"/>
  <line x1="510" y1="155" x2="510" y2="245" stroke="#475569" stroke-width="1.5"/>
  <ellipse cx="485" cy="200" rx="20" ry="25" stroke="#A78BFA" stroke-width="1.5" fill="#A78BFA" fill-opacity="0.1"/>
  <ellipse cx="535" cy="200" rx="20" ry="25" stroke="#A78BFA" stroke-width="1.5" fill="#A78BFA" fill-opacity="0.1"/>
  <text x="510" y="270" text-anchor="middle" fill="#94A3B8" font-family="system-ui" font-size="11" font-weight="600">Telophase</text>
  <!-- Arrows -->
  <path d="M148 200 L168 200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M288 200 L308 200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M428 200 L448 200" stroke="#475569" stroke-width="1.5" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="#475569"/></marker></defs>
</svg>